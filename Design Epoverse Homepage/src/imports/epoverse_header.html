<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EpoVerse — Header</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  .ev-wrap {
    --ink: #10121A;
    --ink-soft: #171A24;
    --line: #262B38;
    --paper: #F4F2EC;
    --muted: #8A90A3;
    --red: #FF4747;
    --international: #5B8DEF;
    --entertainment: #FF5C8A;
    --education: #2FC6A0;
    --sports: #FFB238;
    --finance: #4AD991;
    --technology: #B18CFF;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--ink);
    color: var(--paper);
  }

  .ev-utility {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 28px;
    background: #0A0B10;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .ev-date {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .ev-date svg { width: 13px; height: 13px; opacity: 0.7; }

  .ev-utility-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .ev-links {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #C7CAD6;
  }
  .ev-links a {
    color: inherit;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .ev-links a:hover { color: var(--red); }
  .ev-divider { color: var(--line); }

  .ev-lang {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 11.5px;
    color: #C7CAD6;
  }
  .ev-lang svg { width: 12px; height: 12px; }

  .ev-socials { display: flex; align-items: center; gap: 8px; }
  .ev-socials a {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #1B1E29;
    color: #C7CAD6;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .ev-socials a:hover { transform: translateY(-1px); background: var(--red); color: #fff; }
  .ev-socials svg { width: 11px; height: 11px; }

  .ev-masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 22px 28px 20px;
  }

  .ev-brand { display: flex; flex-direction: column; }
  .ev-logo {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    display: flex;
  }
  .ev-logo .epo { color: #fff; }
  .ev-logo .verse { color: var(--red); position: relative; }
  .ev-logo .dot {
    color: var(--red);
    font-size: 34px;
  }
  .ev-tagline {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ev-tagline span { color: var(--red); }

  .ev-adslot {
    flex: 1;
    max-width: 560px;
    height: 74px;
    border: 1px dashed #33384A;
    border-radius: 10px;
    display: flex;
    align-items: stretch;
    overflow: hidden;
    background: repeating-linear-gradient(135deg, #14161F, #14161F 10px, #171926 10px, #171926 20px);
  }
  .ev-adslot .tag {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .ev-adslot .label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #565C70;
    font-size: 12px;
    letter-spacing: 0.06em;
  }

  .ev-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #0A0B10;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .ev-navlist {
    display: flex;
    align-items: stretch;
    list-style: none;
    margin: 0; padding: 0;
    flex-wrap: wrap;
  }
  .ev-navlist li { display: flex; }
  .ev-navlist a {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 15px 18px;
    color: #D5D8E2;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    position: relative;
    transition: color 0.15s ease;
  }
  .ev-navlist a::after {
    content: "";
    position: absolute;
    left: 18px; right: 18px; bottom: 0;
    height: 2px;
    background: var(--dot, var(--red));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s ease;
  }
  .ev-navlist a:hover::after,
  .ev-navlist li.active a::after { transform: scaleX(1); }
  .ev-navlist li.active a { color: #fff; }
  .ev-navlist a:hover { color: #fff; }

  .ev-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dot, var(--red));
    flex-shrink: 0;
  }
  .ev-chev { width: 9px; height: 9px; opacity: 0.6; margin-left: -1px; }

  .ev-search {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #1B1E29;
    border: none;
    display: flex; align-items: center; justify-content: center;
    color: #D5D8E2;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .ev-search:hover { background: var(--red); color: #fff; }
  .ev-search svg { width: 14px; height: 14px; }

  @media (max-width: 880px) {
    .ev-adslot { display: none; }
    .ev-masthead { padding: 18px 20px; }
    .ev-utility { padding: 8px 20px; }
    .ev-navlist { overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .ev-navlist::-webkit-scrollbar { display: none; }
    .ev-nav { padding: 0 20px; }
    .ev-navlist a { padding: 13px 13px; font-size: 12px; white-space: nowrap; }
  }
</style>
</head>
<body>

<div class="ev-wrap">

  <div class="ev-utility">
    <div class="ev-date">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Friday, 03 July 2026
    </div>
    <div class="ev-utility-right">
      <div class="ev-links">
        <a href="#">Login</a>
        <span class="ev-divider">/</span>
        <a href="#">Registration</a>
      </div>
      <div class="ev-lang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
        English
      </div>
      <div class="ev-socials">
        <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12"/></svg></a>
        <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.9c-.7.3-1.5.6-2.3.7.8-.5 1.5-1.3 1.8-2.3-.8.5-1.7.8-2.6 1a4.1 4.1 0 0 0-7 3.7A11.6 11.6 0 0 1 3.4 4.6a4.1 4.1 0 0 0 1.3 5.5c-.7 0-1.3-.2-1.9-.5v.1c0 2 1.4 3.6 3.3 4a4.1 4.1 0 0 1-1.9.1 4.1 4.1 0 0 0 3.8 2.9A8.2 8.2 0 0 1 2 18.4a11.6 11.6 0 0 0 6.3 1.8c7.5 0 11.7-6.3 11.7-11.7v-.5c.8-.6 1.5-1.3 2-2.1"/></svg></a>
        <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c2.7 0 3 0 4.1.1 1 .1 1.7.2 2.3.5.6.2 1.1.6 1.6 1.1.5.5.8 1 1.1 1.6.3.6.4 1.3.5 2.3.1 1.1.1 1.4.1 4.1s0 3-.1 4.1c-.1 1-.2 1.7-.5 2.3-.2.6-.6 1.1-1.1 1.6-.5.5-1 .8-1.6 1.1-.6.3-1.3.4-2.3.5-1.1.1-1.4.1-4.1.1s-3 0-4.1-.1c-1-.1-1.7-.2-2.3-.5-.6-.2-1.1-.6-1.6-1.1-.5-.5-.8-1-1.1-1.6-.3-.6-.4-1.3-.5-2.3C2.2 15 2.2 14.7 2.2 12s0-3 .1-4.1c.1-1 .2-1.7.5-2.3.2-.6.6-1.1 1.1-1.6.5-.5 1-.8 1.6-1.1.6-.3 1.3-.4 2.3-.5C9 2.2 9.3 2.2 12 2.2M12 0C9.3 0 8.9 0 7.8.1c-1.2.1-2 .3-2.7.6a5.9 5.9 0 0 0-2.1 1.4A5.9 5.9 0 0 0 1.6 4.2c-.3.7-.5 1.5-.6 2.7C.9 8 .9 8.3.9 11s0 3 .1 4.1c.1 1.2.3 2 .6 2.7.3.7.7 1.4 1.4 2.1.6.6 1.3 1 2.1 1.4.7.3 1.5.5 2.7.6C8.9 22 9.3 22 12 22s3.1 0 4.2-.1c1.2-.1 2-.3 2.7-.6a5.9 5.9 0 0 0 2.1-1.4 5.9 5.9 0 0 0 1.4-2.1c.3-.7.5-1.5.6-2.7.1-1.1.1-1.5.1-4.1s0-3.1-.1-4.2c-.1-1.2-.3-2-.6-2.7a5.9 5.9 0 0 0-1.4-2.1A5.9 5.9 0 0 0 18.9.7c-.7-.3-1.5-.5-2.7-.6C15.1 0 14.7 0 12 0Z"/><circle cx="12" cy="12" r="3.2"/></svg></a>
        <a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.5 6.5a2.8 2.8 0 0 0-2-2C18.7 4 12 4 12 4s-6.7 0-8.5.5a2.8 2.8 0 0 0-2 2C1 8.3 1 12 1 12s0 3.7.5 5.5a2.8 2.8 0 0 0 2 2C5.3 20 12 20 12 20s6.7 0 8.5-.5a2.8 2.8 0 0 0 2-2C23 15.7 23 12 23 12s0-3.7-.5-5.5ZM9.7 15.5v-7l6 3.5Z"/></svg></a>
      </div>
    </div>
  </div>

  <div class="ev-masthead">
    <div class="ev-brand">
      <div class="ev-logo"><span class="epo">Epo</span><span class="verse">Verse</span><span class="dot">.</span></div>
      <div class="ev-tagline">Every world<span> · </span>one page</div>
    </div>
    <div class="ev-adslot">
      <div class="tag">AD</div>
      <div class="label">Advertisement space / 728 × 90</div>
    </div>
  </div>

  <div class="ev-nav">
    <ul class="ev-navlist">
      <li class="active"><a href="#">Home</a></li>
      <li style="--dot: var(--international)"><a href="#"><span class="ev-dot"></span>International<svg class="ev-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></a></li>
      <li style="--dot: var(--entertainment)"><a href="#"><span class="ev-dot"></span>Entertainment<svg class="ev-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></a></li>
      <li style="--dot: var(--education)"><a href="#"><span class="ev-dot"></span>Education<svg class="ev-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></a></li>
      <li style="--dot: var(--sports)"><a href="#"><span class="ev-dot"></span>Sports<svg class="ev-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></a></li>
      <li style="--dot: var(--finance)"><a href="#"><span class="ev-dot"></span>Finance<svg class="ev-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></a></li>
      <li style="--dot: var(--technology)"><a href="#"><span class="ev-dot"></span>Technology<svg class="ev-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></a></li>
    </ul>
    <button class="ev-search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>

</div>

</body>
</html>
